<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="海丝智境 · 内容运营管理端 · 客户端版本管理">
  <title>客户端版本管理 · 海丝智境管理端</title>

  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/sidebar.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>

<div class="app">

  <aside class="sidebar">
    <div class="sidebar__brand">
      <div class="sidebar__logo">海</div>
      <div class="sidebar__brand-text">
        <span class="sidebar__brand-name">海丝智境</span>
        <span class="sidebar__brand-slogan">HAISI ZHIJING</span>
      </div>
    </div>

    <nav class="sidebar__nav">
      <div class="sidebar__group">
        <div class="sidebar__group-title">内容发布</div>
        <a class="sidebar__item" href="home-content.html" data-page="home-content">
          <svg class="sidebar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
          <span class="sidebar__label">首页内容管理</span>
        </a>
        <a class="sidebar__item" href="activity.html" data-page="activity">
          <svg class="sidebar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
          <span class="sidebar__label">活动管理</span>
        </a>
        <a class="sidebar__item" href="../index.html" data-page="media">
          <svg class="sidebar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.5" fill="currentColor"/><path d="M21 15l-5-5-9 9"/></svg>
          <span class="sidebar__label">媒体与资源管理</span>
        </a>
      </div>

      <div class="sidebar__group">
        <div class="sidebar__group-title">沉浸与系统</div>
        <a class="sidebar__item" href="ue-content.html" data-page="ue-content">
          <svg class="sidebar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"/></svg>
          <span class="sidebar__label">UE活动内容管理</span>
        </a>
        <a class="sidebar__item sidebar__item--active" href="version.html" data-page="version">
          <svg class="sidebar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 11-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
          <span class="sidebar__label">客户端版本管理</span>
        </a>
        <a class="sidebar__item" href="user-data.html" data-page="user-data">
          <svg class="sidebar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/></svg>
          <span class="sidebar__label">用户与数据管理</span>
        </a>
      </div>
    </nav>

    <div class="sidebar__user">
      <div class="sidebar__avatar">林</div>
      <div class="sidebar__user-info">
        <div class="sidebar__user-name">林主编</div>
        <div class="sidebar__user-role">内容运营 · 管理员</div>
      </div>
      <button class="sidebar__user-action" title="设置">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
      </button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar__breadcrumb">
        <span class="topbar__breadcrumb-item">管理端</span>
        <span class="topbar__breadcrumb-sep">/</span>
        <span class="topbar__breadcrumb-item topbar__breadcrumb-item--current">客户端版本管理</span>
      </div>
      <div class="topbar__spacer"></div>
      <div class="topbar__search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" placeholder="搜索页面、设置、操作…">
      </div>
      <div class="topbar__divider"></div>
      <button class="topbar__icon-btn" title="消息">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 01-3.4 0"/></svg>
        <span class="dot"></span>
      </button>
      <button class="topbar__icon-btn" title="帮助">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 015.8 1c0 2-3 3-3 3M12 17h.01"/></svg>
      </button>
    </header>

    <div class="workspace">
      <main class="content">
        <div class="page-header">
          <div class="page-header__heading">
            <div class="page-eyebrow">CLIENT VERSION</div>
            <h1 class="page-title">客户端版本管理</h1>
            <p class="page-subtitle">发布 UE 客户端新版本，管理多平台安装包、更新类型与灰度策略，控制版本上下线。</p>
          </div>
          <button class="btn btn--primary" id="btn-add">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
            发布新版本
          </button>
        </div>

        <div class="toolbar">
          <div class="toolbar__left">
            <div class="toolbar__search">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
              <input type="text" id="search-input" placeholder="搜索版本号…">
            </div>
            <select class="form__select" id="filter-platform" style="width:auto;min-width:140px">
              <option value="">全部平台</option>
              <option value="Windows">Windows</option>
              <option value="Android">Android</option>
              <option value="iOS">iOS</option>
            </select>
            <select class="form__select" id="filter-status" style="width:auto;min-width:120px">
              <option value="">全部状态</option>
              <option value="已发布">已发布</option>
              <option value="已停用">已停用</option>
            </select>
            <span class="toolbar__count" id="count-text"></span>
          </div>
        </div>

        <div id="table-mount"></div>
      </main>
    </div>
  </div>
</div>

<script src="../js/crud.js"></script>
<script src="../js/version.js"></script>
</body>
</html>
