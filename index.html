<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="海丝智境 · 内容运营管理端 · 媒体资源管理">
  <title>媒体资源管理 · 海丝智境管理端</title>

  <!-- 设计令牌与样式 -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/detail-panel.css">
  <link rel="stylesheet" href="css/components.css">

  <style>
    /* 页面内联关键样式，避免 FOUC */
    .resource-card { animation: fadeIn .35s ease backwards; }
    .resource-card:nth-child(1) { animation-delay: .02s; }
    .resource-card:nth-child(2) { animation-delay: .05s; }
    .resource-card:nth-child(3) { animation-delay: .08s; }
    .resource-card:nth-child(4) { animation-delay: .11s; }
    .resource-card:nth-child(5) { animation-delay: .14s; }
    .resource-card:nth-child(6) { animation-delay: .17s; }
    .resource-card:nth-child(7) { animation-delay: .20s; }
    .resource-card:nth-child(8) { animation-delay: .23s; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="app">

  <!-- ============================== 侧边栏 ============================== -->
  <aside class="sidebar">
    <div class="sidebar__brand">
      <div class="sidebar__logo">海</div>
      <div class="sidebar__brand-text">
        <span class="sidebar__brand-name">海丝智境</span>
        <span class="sidebar__brand-slogan">HAISI ZHIJING</span>
      </div>
    </div>

    <nav class="sidebar__nav">
      <div class="sidebar__group">
        <div class="sidebar__group-title">内容发布</div>
        <a class="sidebar__item" href="pages/home-content.html" data-page="home-content">
          <svg class="sidebar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
          <span class="sidebar__label">首页内容管理</span>
        </a>
        <a class="sidebar__item" href="pages/activity.html" data-page="activity">
          <svg class="sidebar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
          <span class="sidebar__label">活动管理</span>
        </a>
        <a class="sidebar__item sidebar__item--active" href="index.html" data-page="media">
          <svg class="sidebar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.5" fill="currentColor"/><path d="M21 15l-5-5-9 9"/></svg>
          <span class="sidebar__label">媒体与资源管理</span>
        </a>
      </div>

      <div class="sidebar__group">
        <div class="sidebar__group-title">沉浸与系统</div>
        <a class="sidebar__item" href="pages/ue-content.html" data-page="ue-content">
          <svg class="sidebar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"/></svg>
          <span class="sidebar__label">UE活动内容管理</span>
        </a>
        <a class="sidebar__item" href="pages/version.html" data-page="version">
          <svg class="sidebar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 11-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
          <span class="sidebar__label">客户端版本管理</span>
        </a>
        <a class="sidebar__item" href="pages/user-data.html" data-page="user-data">
          <svg class="sidebar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/></svg>
          <span class="sidebar__label">用户与数据管理</span>
        </a>
      </div>
    </nav>

    <div class="sidebar__user">
      <div class="sidebar__avatar">林</div>
      <div class="sidebar__user-info">
        <div class="sidebar__user-name">林主编</div>
        <div class="sidebar__user-role">内容运营 · 管理员</div>
      </div>
      <button class="sidebar__user-action" title="设置">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
      </button>
    </div>
  </aside>

  <!-- ============================== 主区 ============================== -->
  <div class="main">

    <!-- 顶部栏 -->
    <header class="topbar">
      <div class="topbar__breadcrumb">
        <span class="topbar__breadcrumb-item">内容运营</span>
        <span class="topbar__breadcrumb-sep">/</span>
        <span class="topbar__breadcrumb-item topbar__breadcrumb-item--current">媒体资源管理</span>
      </div>
      <div class="topbar__spacer"></div>
      <div class="topbar__search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" placeholder="搜索页面、设置、操作…">
      </div>
      <div class="topbar__divider"></div>
      <button class="topbar__icon-btn" title="消息">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 01-3.4 0"/></svg>
        <span class="dot"></span>
      </button>
      <button class="topbar__icon-btn" title="帮助">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 015.8 1c0 2-3 3-3 3M12 17h.01"/></svg>
      </button>
    </header>

    <!-- 工作区：内容 + 详情 -->
    <div class="workspace">

      <main class="content">

        <!-- 页面标题 + 上传按钮 -->
        <div class="page-header">
          <div class="page-header__heading">
            <div class="page-eyebrow">MEDIA LIBRARY</div>
            <h1 class="page-title">媒体资源管理</h1>
            <p class="page-subtitle">统一管理站点与宣传资源；UE 端主工程资源通过客户端版本发布，不在此处更新。</p>
          </div>
          <button class="btn btn--primary" id="uploadBtn">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
            上传资源
          </button>
        </div>

        <!-- 提示条 -->
        <div class="notice">
          <svg class="notice__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
          <div class="notice__text">
            <strong>资源库需说明：</strong>已发布内容引用的资源不可直接删除，请先替换引用关系，再归档原资源。
          </div>
          <a href="javascript:;" class="notice__action">
            了解规则
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
          </a>
        </div>

        <!-- 工具栏：标签 + 搜索 + 筛选 + 视图 -->
        <div class="toolbar">
          <div class="tabs" id="tabs">
            <div class="tab tab--active" data-type="all">
              全部 <span class="tab__count" data-count="all">8</span>
            </div>
            <div class="tab" data-type="image">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>
              图片 <span class="tab__count" data-count="image">3</span>
            </div>
            <div class="tab" data-type="video">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
              视频 <span class="tab__count" data-count="video">3</span>
            </div>
            <div class="tab" data-type="doc">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>
              文档 <span class="tab__count" data-count="doc">2</span>
            </div>
          </div>

          <div class="toolbar__spacer"></div>

          <div class="search">
            <svg class="search__icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            <input type="text" id="searchInput" placeholder="搜索资源名称或编号">
          </div>

          <div class="toolbar__select">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 3H2l8 9.5V19l4 2v-8.5L22 3z"/></svg>
            筛选
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
          </div>

          <div class="view-toggle" id="viewToggle">
            <button class="view-toggle__btn view-toggle__btn--active" data-view="grid" title="网格视图">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            </button>
            <button class="view-toggle__btn" data-view="list" title="列表视图">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
            </button>
          </div>
        </div>

        <!-- 元信息：共 X 个资源 / 排序 -->
        <div class="meta-row">
          <span>共 <strong id="resultCount" style="color: var(--c-ink-900); font-weight: 600;">8</strong> 个资源</span>
          <div class="meta-row__sort">
            最近更新
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 10l5 5 5-5"/></svg>
          </div>
        </div>

        <!-- 卡片网格（由 JS 渲染） -->
        <div class="card-grid" id="cardGrid">
          <!-- JS 注入 -->
        </div>

      </main>

      <!-- ============================== 详情面板 ============================== -->
      <aside class="detail-panel" id="detailPanel">
        <div class="detail-panel__head">
          <h3 class="detail-panel__title">资源详情</h3>
          <button class="detail-panel__close" id="closeDetail" title="关闭">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>

        <div class="detail-panel__body" id="detailBody">
          <!-- JS 注入 -->
        </div>
      </aside>

    </div>
  </div>
</div>

<!-- 浮动按钮：展开详情面板 -->
<button class="detail-toggle" id="openDetail" style="display: none;" title="显示资源详情">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
</button>

<!-- 数据 + 交互脚本 -->
<script src="js/crud.js"></script>
<script src="js/data.js"></script>
<script src="js/render.js"></script>
<script src="js/main.js"></script>

</body>
</html>
